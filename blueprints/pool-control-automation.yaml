            number:
              min: 0
              max: 120
              unit_of_measurement: "min"

        input_coefficient_ajustement:
          name: "Ajustement Manuel (%)"
          description: "Augmente ou rÃ©duit la durÃ©e calculÃ©e (ex: +10% pour une piscine trÃ¨s exposÃ©e)."
