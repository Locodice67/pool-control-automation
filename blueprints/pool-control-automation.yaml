          selector:
            number:
              min: -50
              max: 50
              unit_of_measurement: '%'
              step: 5

    # ==========================================
    # CATÃ‰GORIE 4 : HELPERS INTERNES
    # ==========================================
    section_helpers:
      name: "Helpers Internes (SystÃ¨me)"
      icon: mdi:database-cog
      collapsed: true
      input:
        input_duree_cycle:
          name: "Helper DurÃ©e (input_number)"
