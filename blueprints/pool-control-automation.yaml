blueprint:
  name: "💧 Gestion Intelligente Piscine v1.2.2"
  description: |

    # 💧 Gestion Avancée de la Piscine
    Une solution complète pour automatiser la filtration, gérer les traitements et optimiser votre consommation électrique.

    **Version: "1.2.2"**
    
    ### 🚀 Fonctionnalités
    - 🕐 **Planification** : Cycle matinal + Pause moteur + Recalcul automatique.
    - 🌡️ **Modes** : Normal, Volume, Hiver, Forcé, Inactif.
    - 🧪 **Traitements** : Durées prédéfinies pour Chlore, Brome, etc.
    - ⚡ **Consommation** : Suivi et notification de la consommation électrique (kWh) de la pompe de filtration et de la PAC (pompe à chaleur).
    - 📲 **Notifications** : Messages Telegram optimisés.

    <details>
    <summary><strong>⚙️ Prérequis et Recommandations</strong></summary>

    1. Entité de la Pompe de filtration (Switch).
    2. Sonde de température de l'eau.
    3. Créez 3 helpers dans HA :
      - `input_boolean` : "Piscine Cycle En Cours"
      - `input_datetime` : "Piscine Début Cycle" (Format: Date et Heure)
      - `input_number` : "Piscine Durée Cycle" (Min: 0, Max: 86400)
      - `input_select` pour le mode contenant : "Filtration normale", "Filtration Volume", "Hivernage", "Forcé", "Inactif", et vos modes de traitement.
    4. (Optionnel) Capteurs de consommation (kWh) de la pompe et de la PAC pour les notifications de suivi énergétique.
    </details>

  domain: automation
  source_url: "https://github.com/Locodice67/pool-control-automation/blob/v1.2.2/blueprints/pool-control-automation.yaml"
  version: "1.2.2"
  input:

    # ==========================================
    # ÉLÉMENT PRINCIPAL (NON REPLIÉ)
    # ==========================================
    pompe_switch:
      name: "Interrupteur de la Pompe"
      description: "L'interrupteur qui commande la mise en marche de la filtration."
      selector:
        entity:
          filter:
            - domain:
                - switch

    pac_switch:
      name: "Interrupteur de la PAC (Pompe à Chaleur)"
      description: "Interrupteur de la PAC, utilisé UNIQUEMENT pour détecter son démarrage et notifier sa consommation. ⚠️ Le blueprint ne commande JAMAIS la PAC (ni allumage ni arrêt)."
      default: ""
      selector:
        entity:
          filter:
            - domain:
                - switch

    # ==========================================
    # CATÉGORIE 1 : CAPTEURS & SÉLECTEURS
    # ==========================================
    section_capteurs:
      name: "Capteurs & Sélecteurs"
      icon: mdi:thermometer-water
      collapsed: true
      input:
        input_temperature_piscine:
          name: "Température de l'Eau"
          description: "Sonde de température mesurant l'eau du bassin."
          selector:
            entity:
              domain: sensor
              device_class: temperature


        input_temperature_exterieure:
          name: "Température Extérieure"
          description: "Sonde de température de l'air ambiant."
          selector:
            entity:
              domain: sensor
              device_class: temperature

        input_saison_sensor:
          name: "Saison"
          description: "Capteur fournissant la saison actuelle (ex: integrations seasons)."
          default: "sensor.season"
          selector:
            entity:
              filter:
                - domain:
                    - sensor

        input_select_mode:
          name: "Sélecteur de Mode"
          description: "Liste déroulante permettant de choisir le mode de filtration ou le traitement en cours."
          selector:
            entity:
              domain: input_select

    # ==========================================
    # CATÉGORIE 2 : PLANIFICATION & HORAIRES
    # ==========================================
    section_planification:
      name: "Planification & Horaires"
      icon: mdi:clock-outline
      collapsed: true
      input:
        input_heure_cycle_matin:
          name: "Heure de Démarrage (Matin)"
          description: "Heure à laquelle le cycle principal doit se déclencher."
          default: "09:00:00"
          selector:
            time: {}

        input_activation_pause:
          name: "Activer la Pause Moteur"
          description: "Permet de couper la pompe pendant 1h."
          default: false
          selector:
            boolean: {}

        input_heure_pause:
          name: "Heure de la Pause Moteur"
          description: "Moment de la coupure si la pause est activée."
          default: "12:00:00"
          selector:
            time: {}

        input_activation_tempo_temp:
          name: "Activer la temporisation de température"
          description: "Active une temporisation au début du cycle du matin pendant laquelle la durée n'est pas calculée selon la température (le temps que la sonde se stabilise)."
          default: false
          selector:
            boolean: {}

        input_duree_tempo_temp:
          name: "Durée de temporisation température (min)"
          description: "Durée d'attente (pompe en marche) au début du cycle du matin avant le calcul de la durée selon la température stabilisée."
          default: 15
          selector:
            number:
              min: 1
              max: 120
              unit_of_measurement: "min"

    # ==========================================
    # CATÉGORIE 3 : PARAMÈTRES DE FILTRATION
    # ==========================================
    section_parametres:
      name: "Paramètres de Filtration"
      icon: mdi:cog-outline
      collapsed: true
      input:
        input_contenance_piscine:
          name: "Volume du bassin (m³)"
          description: "Volume total d'eau de la piscine (indispensable pour le mode 'Filtration Volume')."
          default: 40
          selector:
            number:
              min: 1
              max: 200
              unit_of_measurement: "m³"

        input_debit_pompe_piscine:
          name: "Débit de la pompe (m³/h)"
          description: "Débit de filtration de votre pompe (indispensable pour le mode 'Filtration Volume')."
          default: 15
          selector:
            number:
              min: 1
              max: 50
              unit_of_measurement: "m³/h"

        input_seuil_temperature:
          name: "Seuil Minimum de température (°C)"
          description: "Température en dessous de laquelle la filtration ne se déclenche pas (hors mode Forcé/Hiver)."
          default: 12
          selector:
            number:
              min: 0
              max: 30
              unit_of_measurement: "°C"

        input_filtration_minimale_hiver:
          name: "Durée Minimale Hiver (min)"
          description: "Durée de filtration appliquée en mode Hivernage. ⚠️ À 0, la filtration hivernale est désactivée (cycle non lancé)."
          default: 30
          selector:
            number:
              min: 0
              max: 120
              unit_of_measurement: "min"

        input_coefficient_ajustement:
          name: "Ajustement Manuel (%)"
          description: "Augmente ou réduit la durée calculée (ex: +10% pour une piscine très exposée)."
          default: 0
          selector:
            number:
              min: -50
              max: 50
              unit_of_measurement: '%'
              step: 5

    # ==========================================
    # CATÉGORIE 4 : HELPERS INTERNES
    # ==========================================
    section_helpers:
      name: "Helpers Internes (Système)"
      icon: mdi:database-cog
      collapsed: true
      input:
        input_duree_cycle:
          name: "Helper Durée (input_number)"
          description: "Entité input_number pour mémoriser la durée calculée du cycle en cours. ⚠️ Prérequis : Min: 0, Max: ≥ 86400 (24 h), sinon le recalcul en mode « Forcé » sera écrêté silencieusement."
          selector:
            entity:
              domain: input_number

        input_cycle_start:
          name: "Helper Début (input_datetime)"
          description: "Entité input_datetime mémorisant l'heure de début du cycle."
          selector:
            entity:
              domain: input_datetime

        input_fin_cycle:
          name: "Helper Fin de Cycle (input_datetime)"
          description: "Entité input_datetime mise à jour avec l'heure de fin calculée du cycle."
          selector:
            entity:
              domain: input_datetime

        input_cycle_en_cours:
          name: "Helper Etat (input_boolean)"
          description: "Entité input_boolean indiquant si un cycle est actif."
          selector:
            entity:
              domain: input_boolean

    # ==========================================
    # CATÉGORIE 5 : NOTIFICATIONS
    # ==========================================
    section_notifications:
      name: "Notifications"
      icon: mdi:bell-ring-outline
      collapsed: true
      input:
        notify_service:
          name: "Service de Notification"
          description: "Entité de notification pour recevoir les alertes. Laisser vide pour désactiver."
          default: ""
          selector:
            entity:
              domain: notify

    # ==========================================
    # CATÉGORIE 6 : TRAITEMENTS CHIMIQUES
    # ==========================================
    section_traitements:
      name: "Réglages des Traitements Chimiques"
      icon: mdi:flask-outline
      collapsed: true
      input:
        reglage_anti_calcaire_preventif:
          name: "Anti-calcaire Préventif (h)"
          default: 11
          selector:
            number:
              min: 8.0
              max: 14.0
              step: 1.0
              unit_of_measurement: h

        reglage_anti_calcaire_curatif:
          name: "Anti-calcaire Curatif (h)"
          default: 18
          selector:
            number:
              min: 12.0
              max: 24.0
              step: 1.0
              unit_of_measurement: h

        reglage_anti_algues_preventif:
          name: "Anti-algues Préventif (h)"
          default: 5
          selector:
            number:
              min: 4.0
              max: 6.0
              step: 1.0
              unit_of_measurement: h

        reglage_anti_algues_curatif:
          name: "Anti-algues Curatif (h)"
          default: 10
          selector:
            number:
              min: 8.0
              max: 12.0
              step: 1.0
              unit_of_measurement: h

        reglage_chlore_choc:
          name: "Chlore Choc (h)"
          default: 10
          selector:
            number:
              min: 8.0
              max: 12.0
              step: 1.0
              unit_of_measurement: h

        reglage_oxygene_actif:
          name: "Oxygène Actif (h)"
          default: 9
          selector:
            number:
              min: 6.0
              max: 12.0
              step: 1.0
              unit_of_measurement: h

        reglage_floculant:
          name: "Floculant (h)"
          default: 3
          selector:
            number:
              min: 2.0
              max: 4.0
              step: 1.0
              unit_of_measurement: h

        reglage_ph:
          name: "pH+ ou pH- (h)"
          default: 3
          selector:
            number:
              min: 1.0
              max: 4.0
              step: 1.0
              unit_of_measurement: h

        reglage_algicide_ld:
          name: "Algicide Longue Durée (h)"
          default: 7
          selector:
            number:
              min: 6.0
              max: 8.0
              step: 1.0
              unit_of_measurement: h

        reglage_multi_actions:
          name: "Traitement Multi-actions (h)"
          default: 9
          selector:
            number:
              min: 6.0
              max: 10.0
              step: 1.0
              unit_of_measurement: h

        reglage_brome:
          name: "Brome (h)"
          default: 18
          selector:
            number:
              min: 12.0
              max: 24.0
              step: 1.0
              unit_of_measurement: h

        reglage_sel:
          name: "Électrolyse au Sel (h)"
          default: 18
          selector:
            number:
              min: 12.0
              max: 24.0
              step: 1.0
              unit_of_measurement: h

    # ==========================================
    # CATÉGORIE 7 : CONSOMMATION ÉLECTRIQUE
    # ==========================================
    section_consommation:
      name: "Consommation Électrique"
      icon: mdi:lightning-bolt
      collapsed: true
      input:
        input_conso_pompe:
          name: "Consommation Pompe (kWh)"
          description: "Capteur d'énergie (kWh) mesurant la consommation de la pompe de filtration. Laisser vide pour désactiver le suivi."
          default: ""
          selector:
            entity:
              domain: sensor
              device_class: energy

        input_conso_pac:
          name: "Consommation PAC (kWh)"
          description: "Capteur d'énergie (kWh) mesurant la consommation de la pompe à chaleur. Laisser vide pour désactiver le suivi."
          default: ""
          selector:
            entity:
              domain: sensor
              device_class: energy

variables:
  mode_entity: !input input_select_mode
  pompe_switch: !input pompe_switch
  temp_sensor_entity: !input input_temperature_piscine
  temp_exterieure_entity: !input input_temperature_exterieure
  saison_entity: !input input_saison_sensor
  cycle_start_entity: !input input_cycle_start
  duree_cycle_entity: !input input_duree_cycle
  cycle_en_cours_entity: !input input_cycle_en_cours
  fin_cycle_entity: !input input_fin_cycle
  notify_service: !input notify_service
  heure_pause: !input input_heure_pause
  pause_active: !input input_activation_pause
  tempo_temp_active: !input input_activation_tempo_temp
  tempo_temp_duree: !input input_duree_tempo_temp
  coeff_ajustement: !input input_coefficient_ajustement
  conso_pompe_entity: !input input_conso_pompe
  conso_pac_entity: !input input_conso_pac
  pac_switch: !input pac_switch

  volume_piscine: !input input_contenance_piscine
  debit_pompe: !input input_debit_pompe_piscine
  seuil_temp: !input input_seuil_temperature
  min_hiver: !input input_filtration_minimale_hiver

  r_acp: !input reglage_anti_calcaire_preventif
  r_acc: !input reglage_anti_calcaire_curatif
  r_aap: !input reglage_anti_algues_preventif
  r_aac: !input reglage_anti_algues_curatif
  r_cc: !input reglage_chlore_choc
  r_oa: !input reglage_oxygene_actif
  r_f: !input reglage_floculant
  r_ph: !input reglage_ph
  r_alg_ld: !input reglage_algicide_ld
  r_ma: !input reglage_multi_actions
  r_brome: !input reglage_brome
  r_sel: !input reglage_sel

  mode: "{{ states(mode_entity) }}"
  temp_piscine: "{{ states(temp_sensor_entity) | float(-1) }}"
  temp_exterieure: "{{ states(temp_exterieure_entity) | float(0) }}"
  saison: "{{ states(saison_entity) | lower }}"
  mode_hiver: "{{ saison in ['winter', 'hiver'] }}"
  enable_notif: "{{ notify_service != '' }}"
  enable_conso_pompe: "{{ conso_pompe_entity != '' }}"
  enable_conso_pac: "{{ conso_pac_entity != '' }}"
  conso_pompe_actuelle: "{{ states(conso_pompe_entity) | float(0) if enable_conso_pompe else 0 }}"
  conso_pac_actuelle: "{{ states(conso_pac_entity) | float(0) if enable_conso_pac else 0 }}"

  mode_inconnu: >
    {% set modes_connus = ['Inactif', 'Forcé', 'Hivernage', 'Filtration normale', 'Filtration Volume', 'Chlore lent', 'Anti-calcaire préventif', 'Anti-calcaire curatif', 'Anti-algues préventif', 'Anti-algues curatif', 'Chlore choc', 'Oxygène actif', 'Floculant', 'pH+ ou pH-', 'Algicide longue durée', 'Traitement multi-actions', 'Brome', 'Électrolyse au sel'] %}
    {{ mode not in modes_connus }}

  coefficient_saison: >
    {# En mode Hivernage, durée forcée à min_hiver/60 : ce coefficient n'affecte que les autres modes. #}
    {% if saison == 'summer' or saison == 'ete' %} 1.2
    {% elif saison == 'winter' or saison == 'hiver' %} 0.5
    {% elif saison == 'spring' or saison == 'printemps' %} 0.8
    {% elif saison == 'autumn' or saison == 'automne' %} 0.7
    {% else %} 0.7
    {% endif %}

  duree_heures_calc: |
    {% set m = mode %}
    {% if m == 'Inactif' %}
      0
    {% elif m == 'Forcé' %}
      24
    {% elif m == 'Hivernage' %}
      {{ (min_hiver | int / 60) | round(1) }}
    {% elif m == 'Filtration normale' %}
      {% if temp_piscine | float(-1) < seuil_temp | float(12) %}
        0
      {% else %}
        {{ (temp_piscine / 2 * coefficient_saison) | round(1) }}
      {% endif %}
    {% elif m == 'Filtration Volume' %}
      {% set v = volume_piscine | float %}
      {% set q = debit_pompe | float %}
      {% if q <= 0 %}
        {# Debit pompe invalide -> securite #}
        0
      {% else %}
        {% set t_cycle = v / q %}
        {% set cycles = 1 %}
        {% if temp_piscine >= 28 %} {% set cycles = 4 %}
        {% elif temp_piscine >= 24 %} {% set cycles = 3 %}
        {% elif temp_piscine >= 18 %} {% set cycles = 2 %}
        {% endif %}
        {{ (cycles * t_cycle) | round(1) }}
      {% endif %}
    {% else %}
      {% set duree_temp = (
        (temp_piscine / 2) if m == 'Chlore lent' else
        r_acp if m == 'Anti-calcaire préventif' else
        r_acc if m == 'Anti-calcaire curatif' else
        r_aap if m == 'Anti-algues préventif' else
        r_aac if m == 'Anti-algues curatif' else
        r_cc if m == 'Chlore choc' else
        r_oa if m == 'Oxygène actif' else
        r_f if m == 'Floculant' else
        r_ph if m == 'pH+ ou pH-' else
        r_alg_ld if m == 'Algicide longue durée' else
        r_ma if m == 'Traitement multi-actions' else
        r_brome if m == 'Brome' else
        r_sel if m == 'Électrolyse au sel' else 2
      ) | float(0) %}
      {{ (duree_temp * coefficient_saison) | round(1) }}
    {% endif %}

  duree_secondes: >
    {% set base_sec = (duree_heures_calc | float * 3600) | int %}
    {{ (base_sec * (1 + (coeff_ajustement / 100))) | int }}

mode: parallel
triggers:
  - platform: time
    at: !input input_heure_cycle_matin
    id: cycle_matin
  - platform: homeassistant
    event: start
    id: startup
  - platform: state
    entity_id: !input pompe_switch
    from: "on"
    to: "off"
    id: arret_manuel
  - platform: state
    entity_id: !input pac_switch
    from: "off"
    to: "on"
    id: pac_demarrage

actions:
  - choose:
      # -----------------------------------------------------------
      # 0. NOTIFICATION DÉMARRAGE PAC (notification seule, sans contrôle)
      # -----------------------------------------------------------
      - conditions:
          - condition: trigger
            id: pac_demarrage
          - condition: template
            value_template: "{{ enable_conso_pac }}"
        sequence:
          - choose:
              - conditions: "{{ enable_notif }}"
                sequence:
                  - service: notify.send_message
                    target:
                      entity_id: "{{ notify_service }}"
                    data:
                      message: |
                        ───────────────
                        🔥 PAC démarrée
                        ⚡ Conso PAC : {{ conso_pac_actuelle }} kWh
                      title: "💧 Piscine"
          - stop: "Notification démarrage PAC"

      # -----------------------------------------------------------
      # 1. ARRÊT MANUEL
      # -----------------------------------------------------------
      - conditions:
          - condition: trigger
            id: arret_manuel
          - condition: state
            entity_id: !input input_cycle_en_cours
            state: "on"
          - condition: template
            value_template: >
              {% set now_ts = as_timestamp(now()) %}
              {% set pt = as_timestamp(today_at(heure_pause)) %}
              {{ not (pause_active and pt and now_ts >= (pt - 30) and now_ts < (pt + 3600)) }}
        sequence:
          - choose:
              - conditions: "{{ enable_notif }}"
                sequence:
                  - service: notify.send_message
                    target:
                      entity_id: "{{ notify_service }}"
                    data:
                      message: |
                        ───────────────
                        ⚠️ Arrêt manuel
                        🕒 Pompe arrêtée à {{ now().strftime('%H:%M') }}
                      title: "💧 Piscine"
          - stop: "Arrêt manuel"

      # -----------------------------------------------------------
      # 2. REDÉMARRAGE HA (Silencieux)
      # -----------------------------------------------------------
      - conditions:
          - condition: trigger
            id: startup
          - condition: state
            entity_id: !input input_cycle_en_cours
            state: "on"
        sequence:
          - variables:
              start_ts_raw: "{{ as_timestamp(states(cycle_start_entity)) }}"
              # Garde : helper de début réinitialisé → start_ts = 0 (aucune erreur Jinja)
              start_ts: "{{ start_ts_raw if start_ts_raw is not none else 0 }}"
              duration_val: "{{ states(duree_cycle_entity) | float(0) }}"
              now_ts: "{{ as_timestamp(now()) }}"
              pause_ts: >
                {% set pt_today = as_timestamp(today_at(heure_pause)) %}
                {% if start_ts and pt_today and (now_ts - start_ts) > 86400 and pt_today > now_ts %}
                  {{ pt_today - 86400 }}
                {% else %}
                  {{ pt_today }}
                {% endif %}
              pause_end_ts: "{{ (pause_ts | float(0)) + 3600 }}"
              real_pump_elapsed: >
                {% if pause_active and now_ts >= pause_end_ts %} {{ (now_ts - start_ts) - 3600 }}
                {% elif pause_active and now_ts >= pause_ts %} {{ pause_ts - start_ts }}
                {% else %} {{ now_ts - start_ts }}
                {% endif %}
              remaining_pump_time: "{{ [0, duration_val - (real_pump_elapsed | float)] | max | int }}"

          # Reset propre si l'état des helpers est incohérent (cycle "on" sans heure de début valide)
          - if:
              - condition: template
                value_template: "{{ start_ts_raw is none or start_ts_raw == 0 }}"
            then:
              - service: input_boolean.turn_off
                target:
                  entity_id: !input input_cycle_en_cours
              - service: switch.turn_off
                target:
                  entity_id: "{{ pompe_switch }}"
              - service: input_datetime.set_datetime
                target:
                  entity_id: !input input_cycle_start
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
              - stop: "Cycle incohérent réinitialisé après reboot"

          - choose:
              - conditions: "{{ pause_active and now_ts >= pause_ts and now_ts < pause_end_ts and remaining_pump_time > 0 }}"
                sequence:
                  - service: switch.turn_off
                    target:
                      entity_id: "{{ pompe_switch }}"
                  - delay: "{{ (pause_end_ts - now_ts) | int }}"
                  - service: switch.turn_on
                    target:
                      entity_id: "{{ pompe_switch }}"
                  - delay: "{{ remaining_pump_time }}"

              - conditions: "{{ remaining_pump_time > 0 }}"
                sequence:
                  - service: switch.turn_on
                    target:
                      entity_id: "{{ pompe_switch }}"
                  - delay: "{{ remaining_pump_time }}"

          - service: input_boolean.turn_off
            target:
              entity_id: !input input_cycle_en_cours
          - service: switch.turn_off
            target:
              entity_id: "{{ pompe_switch }}"
          - variables:
              conso_pompe_fin: "{{ conso_pompe_actuelle }}"
              conso_pac_fin: "{{ conso_pac_actuelle }}"
          - choose:
              - conditions: "{{ enable_notif }}"
                sequence:
                  - service: notify.send_message
                    target:
                      entity_id: "{{ notify_service }}"
                    data:
                      message: |
                        ───────────────
                        ✅ Cycle terminé !
                        🏊 Piscine propre !
                        🌡️ Eau : {{ temp_piscine }}°C
                        {% if enable_conso_pompe %}⚡ Conso Pompe : {{ conso_pompe_fin }} kWh{% endif %}{% if enable_conso_pac %}
                        🔥 Conso PAC : {{ conso_pac_fin }} kWh{% endif %}
                      title: "💧 Piscine"
          - stop: "Reprise après reboot terminée"

      # -----------------------------------------------------------
      # 3. LANCEMENT CYCLE (MATIN)
      # -----------------------------------------------------------
      - conditions:
          - condition: trigger
            id: cycle_matin
          # Garde anti-run concurrent : aucun cycle déjà actif en mode parallel
          - condition: state
            entity_id: !input input_cycle_en_cours
            state: "off"
        sequence:
          - condition: template
            value_template: "{{ duree_secondes | int > 0 }}"

          - service: input_datetime.set_datetime
            target:
              entity_id: !input input_cycle_start
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          - service: input_boolean.turn_on
            target:
              entity_id: !input input_cycle_en_cours
          - service: switch.turn_on
            target:
              entity_id: "{{ pompe_switch }}"

          # ─ Temporisation de stabilisation de la sonde ─
          # Si activée : pompe en marche pendant X min, puis la durée de filtration
          # est recalculée sur la température stabilisée (remplace la durée calculée à chaud).
          - if:
              - condition: template
                value_template: "{{ tempo_temp_active }}"
            then:
              - delay: "{{ tempo_temp_duree }}"
              - variables:
                  duree_secondes: |
                    {% set m = states(mode_entity) %}
                    {% set t = states(temp_sensor_entity) | float(-1) %}
                    {% set s = states(saison_entity) | lower %}
                    {% set cs = 1.2 if (s == 'summer' or s == 'ete') else (0.5 if (s == 'winter' or s == 'hiver') else (0.8 if (s == 'spring' or s == 'printemps') else 0.7)) %}
                    {% if m == 'Inactif' %} {% set h = 0 %}
                    {% elif m == 'Forcé' %} {% set h = 24 %}
                    {% elif m == 'Hivernage' %} {% set h = (min_hiver | int / 60) | round(1) %}
                    {% elif m == 'Filtration normale' %}
                      {% if t < seuil_temp | float(12) %} {% set h = 0 %}
                      {% else %} {% set h = (t / 2 * cs) | round(1) %} {% endif %}
                    {% elif m == 'Filtration Volume' %}
                      {% set v = volume_piscine | float %}{% set q = debit_pompe | float %}
                      {% set cycles = 4 if t >= 28 else (3 if t >= 24 else (2 if t >= 18 else 1)) %}
                      {% set h = (cycles * v / q) | round(1) %}
                    {% else %}
                      {% set dt = (t/2) if m == 'Chlore lent' else r_acp if m == 'Anti-calcaire préventif' else r_acc if m == 'Anti-calcaire curatif' else r_aap if m == 'Anti-algues préventif' else r_aac if m == 'Anti-algues curatif' else r_cc if m == 'Chlore choc' else r_oa if m == 'Oxygène actif' else r_f if m == 'Floculant' else r_ph if m == 'pH+ ou pH-' else r_alg_ld if m == 'Algicide longue durée' else r_ma if m == 'Traitement multi-actions' else r_brome if m == 'Brome' else r_sel if m == 'Électrolyse au sel' else 2 %}
                      {% set h = (dt * cs) | round(1) %}
                    {% endif %}
                    {% set base_sec = (h | float * 3600) | int %}
                    {{ (base_sec * (1 + (coeff_ajustement / 100))) | int }}

          # ─ Fige la durée du cycle (recalculée si temporisation active, sinon durée d'origine) ─
          - service: input_number.set_value
            target:
              entity_id: !input input_duree_cycle
            data:
              value: "{{ duree_secondes }}"

          # ─ Calculs de fin de cycle (déplacés hors du bloc notification) ─
          - variables:
              pause_in_cycle: "{{ pause_active and (as_timestamp(today_at(heure_pause)) - as_timestamp(now())) > 0 and (as_timestamp(today_at(heure_pause)) - as_timestamp(now())) < duree_secondes }}"
              duree_affichee_sec: "{{ (duree_secondes + (3600 if pause_in_cycle else 0)) | int }}"
              debut_str: "{{ now().strftime('%H:%M') }}"
              fin_datetime: "{{ (now() + timedelta(seconds=duree_affichee_sec)).strftime('%Y-%m-%d %H:%M:%S') }}"
              # fin_str = HH:MM extrait de la datetime complète (gère le passage minuit)
              fin_str: "{{ fin_datetime[11:16] }}"
              duree_filtration_sec: "{{ duree_secondes }}"
              duree_filtration_h: "{{ (duree_filtration_sec | int // 3600) | int }}"
              duree_filtration_min: "{{ ((duree_filtration_sec | int % 3600) / 60) | round(0) | int }}"
              duree_filtration_str: >
                {% set h = duree_filtration_h | int %}
                {% set m = duree_filtration_min | int %}
                {% if h > 0 and m > 0 %}{{ h }} heures et {{ m }} minutes
                {% elif h > 0 %}{{ h }} heures
                {% else %}{{ m }} minutes
                {% endif %}

          # ─ Met à jour le helper input_datetime de fin de cycle ─
          # Ce changement d'état déclenche le blueprint de contrôle PAC/résistance
          - if:
              - condition: template
                value_template: "{{ fin_cycle_entity is not none and fin_cycle_entity != '' }}"
            then:
              - service: input_datetime.set_datetime
                target:
                  entity_id: "{{ fin_cycle_entity }}"
                data:
                  datetime: "{{ fin_datetime }}"

          # ─ Notification de démarrage ─
          - choose:
              - conditions: "{{ enable_notif }}"
                sequence:
                  - service: notify.send_message
                    target:
                      entity_id: "{{ notify_service }}"
                    data:
                      message: |
                        ───────────────
                        ⚙️ Mode actuel : {{ mode }}
                        🌡️ Températures : Eau {{ temp_piscine }}°C | Ext {{ temp_exterieure }}°C
                        ⏱️ Planning : {{ debut_str }} → {{ fin_str }} ({{ duree_filtration_str }})
                        {% if pause_in_cycle %}
                        ⏸️ Pause moteur prévue à {{ heure_pause }}{% endif %}{% if coeff_ajustement != 0 %}
                        ⚡ Ajustement : {{ coeff_ajustement }}%{% endif %}
                      title: "💧 Piscine"
                      

          # ─ Notification mode indisponible (filtration de secours de 2 h explicite) ─
          - choose:
              - conditions: "{{ enable_notif and mode_inconnu }}"
                sequence:
                  - service: notify.send_message
                    target:
                      entity_id: "{{ notify_service }}"
                    data:
                      message: |
                        ───────────────
                        ⚠️ Mode indisponible
                        Mode « {{ mode }} » non reconnu : filtration de secours de 2 h appliquée.
                        🔧 Vérifiez le sélecteur de mode.
                      title: "💧 Piscine"

          - variables:
              pause_ts: "{{ as_timestamp(today_at(heure_pause)) }}"
              now_ts: "{{ as_timestamp(now()) }}"
              time_before_pause: "{{ (pause_ts - now_ts) | int }}"

          - choose:
              - conditions: "{{ pause_active and time_before_pause > 0 and time_before_pause < duree_secondes }}"
                sequence:
                  - delay: "{{ time_before_pause }}"
                  - service: switch.turn_off
                    target:
                      entity_id: "{{ pompe_switch }}"
                  - choose:
                      - conditions: "{{ enable_notif }}"
                        sequence:
                          - service: notify.send_message
                            target:
                              entity_id: "{{ notify_service }}"
                            data:
                              message: |
                                ───────────────
                                ⚠️ Arrêt sécurité de 1h
                                ▶️ Reprise automatique à {{ (now() + timedelta(hours=1)).strftime('%H:%M') }}
                              title: "💧 Piscine"  
                  - delay: "01:00:00"
                  - service: switch.turn_on
                    target:
                      entity_id: "{{ pompe_switch }}"
                  - choose:
                      - conditions: "{{ enable_notif }}"
                        sequence:
                          - service: notify.send_message
                            target:
                              entity_id: "{{ notify_service }}"
                            data:
                              message: |
                                ───────────────
                                ✅ Fin de la pause moteur
                                ▶️ Filtration reprise
                              title: "💧 Piscine"
                  - variables:
                      remaining_time: "{{ duree_secondes - time_before_pause }}"
                  - delay: "{{ [0, remaining_time | int] | max }}"
            default:
              - delay: "{{ duree_secondes }}"

          # ─ Recalcul avant fin de cycle ─
          # Calcul effectué PENDANT que la pompe tourne encore,
          # pour déterminer si un temps de filtration supplémentaire est nécessaire.
          - variables:
              duree_matin: "{{ states(duree_cycle_entity) | float(0) }}"
              m_now: "{{ states(mode_entity) }}"
              t_now: "{{ states(temp_sensor_entity) | float(-1) }}"
              s_now: "{{ states(saison_entity) | lower }}"
              c_saison_now: >
                {% if s_now == 'summer' or s_now == 'ete' %}1.2
                {% elif s_now == 'winter' or s_now == 'hiver' %}0.5
                {% elif s_now == 'spring' or s_now == 'printemps' %}0.8
                {% elif s_now == 'autumn' or s_now == 'automne' %}0.7
                {% else %}0.7{% endif %}
              duree_now_h: |
                {% if m_now == 'Inactif' %} 0
                {% elif m_now == 'Forcé' %} 24
                {% elif m_now == 'Hivernage' %} {{ (min_hiver | int / 60) | round(1) }}
                {% elif m_now == 'Filtration normale' %}
                  {% if t_now | float(-1) < seuil_temp | float(12) %} 0
                  {% else %} {{ (t_now / 2 * c_saison_now) | round(1) }}
                  {% endif %}
                {% elif m_now == 'Filtration Volume' %}
                  {% set v = volume_piscine | float %}
                  {% set q = debit_pompe | float %}
                  {% if q <= 0 %} 0
                  {% else %}
                    {% set cycles = 4 if t_now >= 28 else (3 if t_now >= 24 else (2 if t_now >= 18 else 1)) %}
                    {{ (cycles * v / q) | round(1) }}
                  {% endif %}
                {% else %}
                  {% set dt = (
                    (t_now / 2) if m_now == 'Chlore lent' else
                    r_acp if m_now == 'Anti-calcaire préventif' else
                    r_acc if m_now == 'Anti-calcaire curatif' else
                    r_aap if m_now == 'Anti-algues préventif' else
                    r_aac if m_now == 'Anti-algues curatif' else
                    r_cc if m_now == 'Chlore choc' else
                    r_oa if m_now == 'Oxygène actif' else
                    r_f if m_now == 'Floculant' else
                    r_ph if m_now == 'pH+ ou pH-' else
                    r_alg_ld if m_now == 'Algicide longue durée' else
                    r_ma if m_now == 'Traitement multi-actions' else
                    r_brome if m_now == 'Brome' else
                    r_sel if m_now == 'Électrolyse au sel' else 2
                  ) | float(0) %}
                  {{ (dt * c_saison_now) | round(1) }}
                {% endif %}
              duree_now_sec: "{{ (duree_now_h | float * 3600 * (1 + (coeff_ajustement / 100))) | int }}"
              delta_time: "{{ [0, duree_now_sec - duree_matin] | max }}"

          # ─ Prolongation si filtration insuffisante ─
          # La pompe tourne encore : on ajoute le temps manquant sans éteindre.
          - if:
              - condition: template
                value_template: "{{ delta_time | int > 300 }}"
            then:
              - variables:
                  recalc_fin: >
                    {{ (now() + timedelta(seconds=delta_time | int)).strftime('%Y-%m-%d %H:%M:%S') }}

              - if:
                  - condition: template
                    value_template: "{{ fin_cycle_entity is not none and fin_cycle_entity != '' }}"
                then:
                  - service: input_datetime.set_datetime
                    target:
                      entity_id: "{{ fin_cycle_entity }}"
                    data:
                      datetime: "{{ recalc_fin }}"

              - service: input_datetime.set_datetime
                target:
                  entity_id: !input input_cycle_start
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
              - service: input_number.set_value
                target:
                  entity_id: !input input_duree_cycle
                data:
                  value: "{{ delta_time | int }}"
              - choose:
                  - conditions: "{{ enable_notif }}"
                    sequence:
                      - service: notify.send_message
                        target:
                          entity_id: "{{ notify_service }}"
                        data:
                          message: |
                            ───────────────
                            🔥 Prolongation du cycle
                            🌡️ Température en hausse, filtration supplémentaire
                            🌡️ Eau : {{ t_now }}°C
                            ➕ Ajout : {{ (delta_time/60) | int }} min
                          title: "💧 Piscine"

              - delay: "{{ delta_time | int }}"

          # ─ FIN DU CYCLE PRINCIPAL ─
          # (cycle marqué terminé avant l'extinction pompe : évite un faux "arrêt manuel" en mode parallel)
          - service: input_boolean.turn_off
            target:
              entity_id: !input input_cycle_en_cours
          - service: switch.turn_off
            target:
              entity_id: "{{ pompe_switch }}"
          - variables:
              conso_pompe_fin: "{{ conso_pompe_actuelle }}"
              conso_pac_fin: "{{ conso_pac_actuelle }}"
          - choose:
              - conditions: "{{ enable_notif }}"
                sequence:
                  - service: notify.send_message
                    target:
                      entity_id: "{{ notify_service }}"
                    data:
                      message: |
                        ───────────────
                        ✅ Cycle terminé !
                        🏊 Piscine propre !
                        🌡️ Eau : {{ temp_piscine }}°C
                        {% if enable_conso_pompe %}⚡ Conso Pompe : {{ conso_pompe_fin }} kWh{% endif %}{% if enable_conso_pac %}
                        🔥 Conso PAC : {{ conso_pac_fin }} kWh{% endif %}
                      title: "💧 Piscine"